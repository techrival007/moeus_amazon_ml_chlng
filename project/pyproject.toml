[project]
name = "ber"
version = "0.1.0"
description = "Amazon ML Challenge 2026 — Business Entity Resolution"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "pyarrow>=19.0",
    "lightgbm>=4.6",
    "tantivy>=0.26",
    "rapidfuzz>=3.14",
    "psutil>=6.1",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ber"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/ber/tests"]
addopts = "-q"
